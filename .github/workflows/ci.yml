name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      - name: install script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install_csview.ps1
          ./install_csview.ps1  # second run must not add PATH twice
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\csview'
          if (-not (Test-Path (Join-Path $dir 'csview.exe'))) { throw 'csview.exe not installed' }
          $path = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $hits = @($path -split ';' | Where-Object { $_ -ieq $dir }).Count
          if ($hits -ne 1) { throw "expected $dir on user PATH once, found $hits" }
